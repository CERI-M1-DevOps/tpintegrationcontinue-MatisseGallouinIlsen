name: Java CI with Maven - Test and package
on: [pull_request] # Ce workflow se déclenche sur un push dans le dépôt
jobs:
  Salutations: # Nom du job : Salutations
    name: Salutations
    runs-on: ubuntu-latest # OS où s'exécute le job
    steps:
      - name: Depot courant # une tâche pour se placer dans le depot courant
        uses: actions/checkout@v5

      - name: Setup Java # une tâche pour mettre en place notre java
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Verification Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository

      - name: Maven package
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=$(echo ${{ github.repository }} | sed 's-/-_-')

